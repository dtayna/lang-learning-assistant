<h1 class="page-title">My Words</h1>
<section class="bg-white m-10 rounded-md p-5 text-sky-900">
    <form class="flex flex-col gap-5" [formGroup]="wordForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-12 gap-5">
            <div class="col-span-12 lg:col-span-6">
                <label class="input-label" for="word">  <span class="text-red-500">*</span> Word: </label>
                <input class="input-text" name="word" formControlName="word" type="text" placeholder="Add new word..." >
            </div>
            <div class="col-span-12 lg:col-span-6">
                <label class="input-label" for="translation"> Translation:</label>
                <input class="input-text" name="translation"  formControlName="translation" type="text" placeholder="Add word translation..." >
            </div>
        </div>
        <div class="grid grid-cols-12">
            <div class="col-span-12">
                <label class="input-label" for="meaning"> Meaning: </label>
                <textarea class="input-text" name="meaning" formControlName="meaning" placeholder="Add word meaning..."></textarea>
            </div>
        </div>
        <div class="grid grid-cols-12">
            <div class="col-span-12">
                <label class="input-label" for="examples"> Context examples: </label>
                <textarea class="input-text" name="examples"  formControlName="examples" placeholder="Add context examples..."></textarea>
            </div>
        </div>
        <div class="flex gap-5 justify-end">
            <button class="cancel-button" type="button"> Cancel </button>
            <button class="submit-button" type="submit" [disabled]="!wordForm.valid"> Add Word </button>
        </div>
    </form>
</section>

<section class="bg-white m-10 rounded-md p-5 text-sky-900">
    <table class="w-full">
        <thead>
            <tr class="text-left text-white bg-sky-700">
                <th class="border p-5 border-gray-200">Word</th>
                <th class="border p-5 border-gray-200">
                    <div class="flex items-center">
                        <span>Translation</span>
                    
                        <button
                          class="ml-auto"
                          (click)="onTranslationVisibilityToggle()">
                    
                          <mat-icon
                            [fontIcon]="translationVisible ? 'visibility_off' : 'visibility'">
                          </mat-icon>
                    
                        </button>
                      </div>
                </th>
                <th class="border p-5 border-gray-200">Meaning</th>
                <th class="border p-5 border-gray-200">Context Examples</th>
                <th class="border p-5 border-gray-200">Actions</th>
            </tr>
        </thead>
        <tbody>
            @for (word of words; track word.id) {
                <tr class="border rounded-md border-gray-100">
                    <td class="p-3 font-bold bg-sky-100">{{ word.word }}</td>
                    <td class="p-3 text-orange-500 bg-orange-100">
                        {{ translationVisible ? word.translation: "--" }}
                    </td>
                    <td class="p-3">{{ word.meaning }}</td>
                    <td class="p-3">{{ word.examples }}</td>
                    <td class="text-center">
                        <button class="items-center justify-center" (click)="onDelete(word.id)"> 
                            <mat-icon fontIcon="delete" class="delete-icon"></mat-icon>
                        </button>
                    </td>
                </tr>
            }  
        </tbody>
    </table>
</section>
